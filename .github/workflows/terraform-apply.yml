name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "live/01_network/**"
      - "modules/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch: # morning bring-up: Actions → terraform-apply → Run workflow

permissions:
  contents: read
  id-token: write # lets the job request a GitHub OIDC token

# One apply at a time, and never cancel a running one: a half-finished apply
# leaves AWS and the state out of step.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.8"
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    runs-on: ubuntu-24.04
    # The job waits here for the owner's approval. Only jobs in this environment get the
    # OIDC sub "...:environment:infra" that the apply role trusts, and only from main.
    environment: infra
    strategy:
      max-parallel: 1 # layers depend on each other: one at a time, in list order
      matrix:
        layer: [01_network]
    defaults:
      run:
        working-directory: live/${{ matrix.layer }}

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }} # environment secret: only readable by jobs in "infra"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}
          mask-aws-account-id: true

      - name: init
        run: terraform init -input=false -backend-config=../backend.hcl

      - name: plan
        id: plan
        run: |
          # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes
          set +e
          terraform plan -input=false -no-color -lock-timeout=60s -detailed-exitcode -out=tfplan
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          {
            echo "### Terraform apply: \`${{ matrix.layer }}\` (changes: $([ "$code" -eq 2 ] && echo yes || echo no))"
            echo '```'
            terraform show -no-color tfplan | sed "s/${ACCOUNT_ID}/<account-id>/g" | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: apply
        if: steps.plan.outputs.changes == 'true'
        run: terraform apply -input=false -no-color -lock-timeout=60s tfplan
