name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "live/01_network/**"
      - "live/02_eks/**"
      - "live/03_platform/**"
      - "live/04_data/**"
      - "modules/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch: # morning bring-up: Actions → terraform-apply → Run workflow

permissions:
  contents: read
  id-token: write # lets the job request a GitHub OIDC token

# One apply at a time, and never cancel a running one: a half-finished apply
# leaves AWS and the state out of step. Shares the group with terraform-destroy.
concurrency:
  group: terraform-infra
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.8"
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"
  LAYERS: "01_network 02_eks 03_platform 04_data" # apply order; each layer reads the ones before it

jobs:
  apply:
    runs-on: ubuntu-24.04
    # The job waits here for the owner's approval: ONE approval brings the whole stack up.
    # Only jobs in this environment get the OIDC sub "...:environment:infra", and only from main.
    environment: infra
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }} # environment secret: only readable by jobs in "infra"
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}
          role-duration-seconds: 3600 # EKS create + node group can take ~20 min
          mask-aws-account-id: true

      - name: plan and apply each layer in order
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # 04_data restores prod from the newest nightly snapshot (empty = first run: new database).
          # Two lines on purpose: a failed lookup inside "export VAR=$(...)" would not stop the job.
          SNAPSHOT=$(bash scripts/latest-db-snapshot.sh)
          export TF_VAR_restore_snapshot_identifier="$SNAPSHOT"
          echo "Prod database restores from: ${SNAPSHOT:-nothing (new empty database)}" | tee -a "$GITHUB_STEP_SUMMARY"

          for layer in $LAYERS; do
            echo "::group::$layer"
            cd "live/$layer"
            terraform init -input=false -no-color -backend-config=../backend.hcl

            # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes
            set +e
            terraform plan -input=false -no-color -lock-timeout=60s -detailed-exitcode -out=tfplan
            code=$?
            set -e
            [ "$code" -eq 1 ] && exit 1

            {
              echo "### \`$layer\`: $([ "$code" -eq 2 ] && echo changes applied || echo no changes)"
              echo '<details><summary>plan</summary>'
              echo
              echo '```'
              terraform show -no-color tfplan | sed "s/${ACCOUNT_ID}/<account-id>/g" | tail -c 30000
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$code" -eq 2 ]; then
              terraform apply -input=false -no-color -lock-timeout=60s tfplan
            fi
            rm -f tfplan
            cd - > /dev/null
            echo "::endgroup::"
          done
