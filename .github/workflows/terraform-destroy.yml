name: terraform-destroy

on:
  schedule:
    - cron: "0 22 * * *" # 22:00 UTC safety net: nothing daily survives the night (ADR-0016)
  workflow_dispatch: # manual tear-down: Actions → terraform-destroy → Run workflow

permissions:
  contents: read
  id-token: write

# Same group as terraform-apply: a destroy never runs in the middle of an apply, and vice versa
concurrency:
  group: terraform-infra
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.8"
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"
  LAYERS: "04_data 03_platform 02_eks 01_network" # reverse of the apply order
  CLUSTER_NAME: myeks # live/02_eks: cluster name = project

jobs:
  destroy:
    runs-on: ubuntu-24.04
    # No reviewer on this environment: nobody approves at 22:00. Still main only, so a PR
    # can never run it. Its own environment secret AWS_APPLY_ROLE_ARN (same role).
    environment: infra-destroy
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-destroy-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true

      # Tear down in the reverse order of bring-up: the apps first, while the platform
      # controllers (ESO, ALB controller, ExternalDNS, EBS CSI) are still running and can
      # finish their own cleanup (finalizers, load balancers, DNS records, volumes). Then the platform.
      # 1. Stop Argo CD's application controller. Deleting the Applications alone is a race:
      #    the root app (self-heal) re-created a child it had just lost, which re-created the
      #    namespace, the Ingress and a new ALB (2026-10-25).
      # 2. Delete the Applications: no finalizer, so only the Application objects go.
      # 3. Delete the namespaces they deployed into and wait until they are really gone.
      - name: Drain the apps (cluster up only)
        env:
          CLUSTER: ${{ env.CLUSTER_NAME }}
          KEEP: "argocd kube-system kube-public kube-node-lease default kyverno external-secrets external-dns"
        run: |
          set -euo pipefail
          if ! aws eks describe-cluster --name "$CLUSTER" > /dev/null 2>&1; then
            echo "No cluster: nothing to drain"; exit 0
          fi
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION" > /dev/null
          if ! kubectl get crd applications.argoproj.io > /dev/null 2>&1; then
            echo "No Argo CD: nothing to drain"; exit 0
          fi
          NAMESPACES=$(kubectl get applications -n argocd \
            -o jsonpath='{range .items[*]}{.spec.destination.namespace}{"\n"}{end}' | sort -u)
          kubectl -n argocd scale statefulset argocd-application-controller --replicas=0
          kubectl -n argocd rollout status statefulset argocd-application-controller --timeout=120s
          # Only the controller removes Application finalizers (e.g. kyverno's pre-delete hook
          # finalizer), and it is stopped now: drop them, or the delete waits forever.
          # The namespaces below are deleted directly, so no cascade is lost.
          for app in $(kubectl get applications -n argocd -o name); do
            kubectl patch -n argocd "$app" --type=merge -p '{"metadata":{"finalizers":null}}'
          done
          kubectl delete applications -n argocd --all --wait=true --timeout=120s
          for ns in $NAMESPACES; do
            case " $KEEP " in *" $ns "*) continue ;; esac
            echo "Deleting namespace $ns"
            kubectl delete namespace "$ns" --ignore-not-found --wait=false
          done
          for ns in $NAMESPACES; do
            case " $KEEP " in *" $ns "*) continue ;; esac
            kubectl wait --for=delete "namespace/$ns" --timeout=300s || {
              echo "::error::namespace $ns still terminating after 5 min"
              kubectl get namespace "$ns" -o jsonpath='{.status.conditions}'; exit 1; }
          done
          echo "Apps drained: ${NAMESPACES//$'\n'/ }" | tee -a "$GITHUB_STEP_SUMMARY"
          # The ALB is gone with its Ingress (finalizer); ExternalDNS removes the DNS records on its
          # next sync (every minute). Give it up to 3 min; the next step gives the verdict.
          for i in $(seq 1 12); do
            bash scripts/leftover-check.sh k8s > /dev/null 2>&1 && break
            echo "waiting for the ALB and DNS records to go ($i/12)"; sleep 15
          done

      # Anything a controller created in AWS (load balancers, volumes) must be gone by now,
      # or terraform destroy would hang on ENIs it does not know about
      - name: Kubernetes-created resources gone?
        run: bash scripts/leftover-check.sh k8s

      # Prod data survives the night: dated snapshot (after the drain, so no app is writing),
      # keep the newest 3. The next apply restores the newest. Must succeed before any destroy.
      - name: Snapshot the prod database
        run: bash scripts/snapshot-db.sh

      - name: destroy each layer in reverse order
        run: |
          set -euo pipefail
          for layer in $LAYERS; do
            echo "::group::$layer"
            cd "live/$layer"
            terraform init -input=false -no-color -backend-config=../backend.hcl
            if [ -z "$(terraform state list)" ]; then
              echo "$layer: nothing deployed, skipping" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              terraform destroy -input=false -no-color -lock-timeout=60s -auto-approve
              echo "$layer: destroyed" >> "$GITHUB_STEP_SUMMARY"
            fi
            cd - > /dev/null
            echo "::endgroup::"
          done

      # A failed scheduled run emails the repo owner: that email is the alarm
      - name: leftover check
        run: bash scripts/leftover-check.sh all
