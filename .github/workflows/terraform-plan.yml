name: terraform-plan

on:
  pull_request:
    branches: [main]
    paths:
      - "live/**"
      - "modules/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write      # lets the job request a GitHub OIDC token
  pull-requests: write # lets the job post the plan comment

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.8"
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: 00_bootstrap
          - layer: 01_network
          - layer: 02_eks
            requires: network # reads /myeks/network/*: plan is skipped while the daily network is down
          # Validate only: planning a helm_release reads Helm's release Secrets in the cluster, and the
          # PR-triggered plan role gets no cluster access. The real plan runs in terraform-apply, after approval.
          - layer: 03_platform
            validate_only: true
    defaults:
      run:
        working-directory: live/${{ matrix.layer }}

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}
          mask-aws-account-id: true

      - name: fmt
        run: terraform fmt -check -recursive ../..

      - name: init
        run: terraform init -input=false -backend-config=../backend.hcl

      - name: validate
        run: terraform validate -no-color

      # A daily layer can only be planned while the layer it reads from is deployed (SSM contract).
      # Validate still runs, so syntax and module errors are caught either way.
      - name: validate only
        if: matrix.validate_only
        run: echo "Validate passed. No PR plan for this layer (the plan role has no cluster access); the plan runs in terraform-apply after approval." > plan.txt

      - name: upstream deployed?
        id: deps
        if: matrix.requires
        run: |
          if [ -n "$(aws ssm get-parameters-by-path --path "/myeks/${{ matrix.requires }}" --query 'Parameters[0].Name' --output text | grep -v None)" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Plan skipped: /myeks/${{ matrix.requires }}/* not found (that layer is not deployed). Validate passed. Bring the stack up (terraform-apply → Run workflow) and re-run this check to see the plan." > plan.txt
          fi

      - name: Kubernetes version still in standard support?
        if: matrix.layer == '02_eks'
        run: |
          v=$(sed -n 's/^kubernetes_version *= *"\(.*\)"/\1/p' terraform.tfvars)
          end=$(aws eks describe-cluster-versions --cluster-versions "$v" --query 'clusterVersions[0].endOfStandardSupportDate' --output text)
          days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "Kubernetes $v: standard support ends $end ($days days)"
          if [ "$days" -lt 0 ]; then echo "::error::Kubernetes $v is in EXTENDED support (6x the price). Upgrade it."; exit 1; fi
          if [ "$days" -lt 90 ]; then echo "::warning::Kubernetes $v leaves standard support in $days days. Plan the upgrade."; fi

      - name: plan
        id: plan
        if: steps.deps.outputs.ok != 'false' && !matrix.validate_only
        env:
          TF_VAR_budget_alert_emails: ${{ secrets.BUDGET_ALERT_EMAILS }}
        run: |
          set -o pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform plan -input=false -no-color -lock-timeout=60s -out=tfplan
          # Log masking does not cover PR comments, so strip the account ID ourselves
          terraform show -no-color tfplan | sed "s/${ACCOUNT_ID}/<account-id>/g" > plan.txt

      - name: comment plan on PR
        if: always() && (steps.plan.outcome != 'skipped' || steps.deps.outputs.ok == 'false' || matrix.validate_only)
        uses: actions/github-script@v8
        env:
          LAYER: ${{ matrix.layer }}
        with:
          script: |
            const fs = require('fs');
            const file = `live/${process.env.LAYER}/plan.txt`;
            const plan = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : 'Plan failed - see the job log.';
            const marker = `<!-- tf-plan:${process.env.LAYER} -->`;
            const body = `${marker}\n### Terraform plan: \`${process.env.LAYER}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
