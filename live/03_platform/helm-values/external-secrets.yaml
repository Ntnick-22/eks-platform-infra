# External Secrets Operator. Terraform owns it (IAM-linked add-on, ADR: add-on split).
installCRDs: true
# Keep the CRDs on uninstall (Argo CD's chart does the same). Otherwise helm uninstall deletes
# the controller and its CRDs at once: an ExternalSecret's cleanup finalizer can then never be
# removed, the CRD deletion hangs and the nightly destroy times out (2026-10-24).
# The cluster destroy removes the kept CRDs anyway.
crds:
  annotations:
    helm.sh/resource-policy: keep
# Dev-sized: 1 replica each; the webhook validates ExternalSecret objects
replicaCount: 1
webhook:
  replicaCount: 1
certController:
  replicaCount: 1
